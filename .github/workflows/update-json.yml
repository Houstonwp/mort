name: Validate converted JSON

on:
  pull_request:
    paths:
      - 'xml/**'
      - 'json/**'
      - 'cmd/updatejson/**'
      - 'internal/jsonupdate/**'
      - 'internal/xtbml/**'
      - '.github/workflows/update-json.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Keep the default PR merge checkout. Validation needs no branch writes or
      # secrets, and works for both same-repository and fork pull requests.
      - name: Check out proposed merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check generated JSON for changed tables
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/updatejson -base "$BASE_SHA" -check
