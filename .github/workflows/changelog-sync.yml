name: Sync SOA tables

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:
    inputs:
      tableId:
        description: 'Optional SOA table ID to fetch (positive integer)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-soa-tables
  cancel-in-progress: false

jobs:
  sync:
    # Manual runs must use the default branch, just like the schedule.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Go tooling
        run: |
          go test ./...
          go vet ./...

      - name: Run changelog sync
        env:
          TABLE_ID: ${{ inputs.tableId }}
        run: |
          if [ -n "$TABLE_ID" ]; then
            if [[ ! "$TABLE_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo 'tableId must be a positive integer' >&2
              exit 1
            fi
            go run ./cmd/changelogsync -table "$TABLE_ID"
          else
            go run ./cmd/changelogsync
          fi

      - name: Regenerate changed JSON
        run: go run ./cmd/updatejson

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate web build with updated data
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit XML, JSON, and changelog state together
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Stage first so newly added tables are included in the change check.
          git add -A -- xml json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "mort-bot"
          git config user.email "mort-bot@users.noreply.github.com"
          git commit -m "Sync SOA tables and generated JSON"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    # GITHUB_TOKEN pushes do not trigger push workflows. Pass the exact new
    # commit to the existing deployment workflow instead of relying on that event.
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}
    permissions:
      contents: read
      pages: write
      id-token: write
